version: 2

# ============================================================================
# Контракт 3NF-ядра (L4.1, план §4 «silver»): ссылочная целостность ядра +
# корректность время-вариантных версий.
#   • идентичность: unique/not_null PK и ключей;
#   • версии: unique (PK, valid_from); ровно одна is_current на сущность —
#     singular-тест int_single_current_version.sql;
#   • FK-целостность между сущностями ядра (relationships);
#   • справочники: accepted_values.
# ============================================================================

models:
  - name: int_customers
    description: Идентичность клиента (без атрибутов) — будущий h_customer.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests: [unique, not_null]
      - name: registered_at
        data_tests: [not_null]

  - name: int_customer_attributes
    description: >
      История атрибутов клиента (паттерн №1): сегмент/город с valid_from/valid_to;
      «тихие версии» (soft delete без смены атрибутов) отфильтрованы.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [customer_id, valid_from]
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_customers')
              field: customer_id
      - name: segment
        data_tests:
          - accepted_values:
              values: ['standard', 'premium', 'vip']
      - name: valid_from
        data_tests: [not_null]

  - name: int_categories
    description: Статическая иерархия категорий (самоссылка, 3 уровня).
    columns:
      - name: category_id
        data_tests: [unique, not_null]
      - name: parent_category_id
        data_tests:
          - relationships:
              to: ref('int_categories')
              field: category_id

  - name: int_products
    description: Идентичность товара (без категорийной истории).
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_key
        data_tests: [unique, not_null]
      - name: list_price
        data_tests: [not_null]

  - name: int_product_categories
    description: История принадлежности категории (паттерн №5) — valid-time иерархии.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [product_id, valid_from]
    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_products')
              field: product_id
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_categories')
              field: category_id

  - name: int_stores
    description: Магазины; жизненный цикл в opened_at/closed_at (паттерн №6).
    columns:
      - name: store_id
        data_tests: [unique, not_null]
      - name: store_key
        data_tests: [unique, not_null]
      - name: format
        data_tests:
          - accepted_values:
              values: ['mall', 'street', 'online']

  - name: int_orders
    description: Идентичность заказа — неизменяемые поля + естественные FK.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_key
        data_tests: [unique, not_null]
      - name: order_no
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('int_customers')
              field: customer_id
      - name: store_id
        data_tests:
          - relationships:
              to: ref('int_stores')
              field: store_id
      - name: order_ts
        data_tests: [not_null]

  - name: int_order_states
    description: >
      История состояний заказа (паттерны №2, №3): статусный трек + версии сумм;
      KPI №4 отвечает отсюда напрямую.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, valid_from]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_orders')
              field: order_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['created', 'paid', 'shipped', 'delivered', 'cancelled', 'returned']

  - name: int_order_lines
    description: Строки заказов с версиями сумм (ретро-правки №3).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_line_id, valid_from]
    columns:
      - name: order_line_id
        data_tests: [not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('int_orders')
              field: order_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('int_products')
              field: product_id
      - name: line_amount
        data_tests: [not_null]

  - name: int_payments
    description: Платежи с версиями (refund-переходы, паттерн №9).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [payment_id, valid_from]
    columns:
      - name: payment_id
        data_tests: [not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('int_orders')
              field: order_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['authorized', 'captured', 'refunded']
